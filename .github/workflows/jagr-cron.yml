# Drives Jagr's scheduler from outside Vercel (Vercel Hobby allows a Cron Job at most once a day).
# Every 15 minutes it calls /api/cron/tick to enqueue due work, then makes at most 10 calls to
# /api/cron/worker. Each worker request claims exactly one job. This is a bounded transitional runner,
# not a precise scheduler: GitHub Actions schedules can start late or be skipped. Missed watch slots are not replayed one by one:
# after a late or skipped trigger, only each watch's latest due slot is scheduled. GitHub change monitoring
# reads the last 6 hours on every run, so changes made during a gap are still seen.
#
# Setup (repository → Settings → Secrets and variables → Actions):
#   variable JAGR_APP_URL   e.g. https://jagr.vercel.app
#   secret   CRON_SECRET    the same value as the Vercel environment variable CRON_SECRET
# Until both are set, the workflow skips (it never fails for lack of configuration).
name: Jagr scheduler tick

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: jagr-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call /api/cron/tick
        env:
          JAGR_APP_URL: ${{ vars.JAGR_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$JAGR_APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::JAGR_APP_URL (variable) or CRON_SECRET (secret) is not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o body.json -w '%{http_code}' --max-time 90 --request POST \
            -H "Authorization: Bearer $CRON_SECRET" "${JAGR_APP_URL%/}/api/cron/tick")
          # The response holds counts only (no workspace data, no secrets).
          cat body.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::/api/cron/tick answered $status"
            exit 1
          fi
      - name: Run up to 10 queued jobs
        env:
          JAGR_APP_URL: ${{ vars.JAGR_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$JAGR_APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            exit 0
          fi
          for attempt in $(seq 1 10); do
            status=$(curl -sS -o worker.json -w '%{http_code}' --max-time 90 --request POST \
              -H "Authorization: Bearer $CRON_SECRET" "${JAGR_APP_URL%/}/api/cron/worker")
            cat worker.json; echo
            if [ "$status" != "200" ]; then
              echo "::error::/api/cron/worker answered $status"
              exit 1
            fi
            if grep -q '"state":"idle"' worker.json; then
              break
            fi
          done
